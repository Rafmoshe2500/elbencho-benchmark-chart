{{- if eq .Values.mode "service" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "elbencho.fullname" . }}
  labels:
    {{- include "elbencho.labels" . | nindent 4 }}
spec:
  # Headless: gives each StatefulSet pod a DNS record <fullname>-<N>.<fullname>
  clusterIP: None
  # Publish DNS before readiness so the daemons can be resolved as soon as they start
  publishNotReadyAddresses: true
  ports:
    - port: {{ .Values.service.port }}
      targetPort: service-port
      protocol: TCP
      name: service-port
  selector:
    {{- include "elbencho.selectorLabels" . | nindent 4 }}
{{- end }}
