{{- if eq .Values.mode "standalone" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "elbencho.fullname" . }}
  labels:
    {{- include "elbencho.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if include "elbencho.hasStorage" . }}
  # A volume is usually RWO: never run old and new pod at the same time.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "elbencho.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "elbencho.podMeta" . | trim | nindent 6 }}
    spec:
      {{- include "elbencho.podCommon" (dict "ctx" . "withClaim" true) | trim | nindent 6 }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.standalone.command }}
          command:
            {{- include "elbencho.quoteList" . | trim | nindent 12 }}
          {{- end }}
          {{- with .Values.standalone.args }}
          args:
            {{- include "elbencho.quoteList" . | trim | nindent 12 }}
          {{- end }}
          {{- include "elbencho.containerCommon" . | trim | nindent 10 }}
{{- end }}
