{{- if eq .Values.mode "service" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "elbencho.fullname" . }}
  labels:
    {{- include "elbencho.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "elbencho.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  # Start all daemons at once instead of one by one
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "elbencho.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "elbencho.podMeta" . | trim | nindent 6 }}
    spec:
      {{- include "elbencho.podCommon" (dict "ctx" . "withClaim" (not (include "elbencho.perPodClaims" .))) | trim | nindent 6 }}
      containers:
        {{- range $i := until (int (max 1 (int $.Values.serviceMode.instancesPerPod))) }}
        {{- $port := add (int $.Values.service.port) $i }}
        - name: {{ $.Chart.Name }}{{ if $i }}-{{ add $i 1 }}{{ end }}
          command: ["elbencho"]
          args:
            # --foreground is required: without it elbencho daemonizes and the container exits.
            - "--service"
            - "--foreground"
            - "--port"
            - {{ $port | quote }}
            {{- with $.Values.serviceMode.extraArgs }}
            {{- include "elbencho.quoteList" . | trim | nindent 12 }}
            {{- end }}
          ports:
            - name: svc-{{ $port }}
              containerPort: {{ $port }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: {{ $port }}
            periodSeconds: 5
          {{- include "elbencho.containerCommon" $ | trim | nindent 10 }}
        {{- end }}
  {{- if include "elbencho.perPodClaims" . }}
  volumeClaimTemplates:
    - metadata:
        name: {{ .Values.persistence.volumeName }}
      spec:
        volumeMode: {{ include "elbencho.volumeMode" . }}
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
  {{- end }}
{{- end }}
