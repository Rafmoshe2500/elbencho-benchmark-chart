{{- if and (eq .Values.protocol "s3") (not .Values.s3.existingSecret) .Values.s3.accessKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "elbencho.s3SecretName" . }}
  labels:
    {{- include "elbencho.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.s3.accessKeySecretKey }}: {{ .Values.s3.accessKey | quote }}
  {{ .Values.s3.secretKeySecretKey }}: {{ .Values.s3.secretKey | quote }}
{{- end }}
