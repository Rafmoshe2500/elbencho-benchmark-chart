{{- if eq .Values.mode "job" }}
apiVersion: batch/v1
kind: Job
metadata:
  # The revision suffix lets `helm upgrade` replace the Job (Job pod templates are immutable).
  name: {{ include "elbencho.fullname" . }}-job-r{{ .Release.Revision }}
  labels:
    {{- include "elbencho.labels" . | nindent 4 }}
    app.kubernetes.io/component: job
spec:
  backoffLimit: {{ .Values.job.backoffLimit }}
  {{- if not (kindIs "invalid" .Values.job.ttlSecondsAfterFinished) }}
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
  {{- end }}
  {{- if not (kindIs "invalid" .Values.job.activeDeadlineSeconds) }}
  activeDeadlineSeconds: {{ .Values.job.activeDeadlineSeconds }}
  {{- end }}
  template:
    metadata:
      {{- include "elbencho.podMeta" . | trim | nindent 6 }}
    spec:
      restartPolicy: Never
      {{- include "elbencho.podCommon" (dict "ctx" . "withClaim" true) | trim | nindent 6 }}
      containers:
        - name: {{ .Chart.Name }}
          command: ["/usr/local/bin/elbencho"]
          args:
            {{- with include "elbencho.s3Args" . | trim }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- include "elbencho.quoteList" .Values.job.args | trim | nindent 12 }}
          {{- include "elbencho.containerCommon" . | trim | nindent 10 }}
{{- end }}
